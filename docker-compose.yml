# Two ways to run:
#
#   docker compose up -d                       Postgres + Redis only; run the app with uvicorn
#   docker compose --profile full up --build   everything, including the app
#
# The app uses host networking because WebRTC sends audio over UDP on random
# ports that a normal port mapping can't cover. Works out of the box on Linux;
# Docker Desktop (Mac/Windows) needs "Enable host networking" in Settings >
# Resources > Network (Docker Desktop 4.34+). If that isn't available, run the
# app with uvicorn instead.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: memory
      POSTGRES_PASSWORD: memory
      POSTGRES_DB: memory_game
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory -d memory_game"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    profiles: ["full"]
    build: .
    network_mode: host
    env_file:
      - path: .env
        required: false
    environment:
      # Host networking: reach Postgres and Redis through their published ports.
      DATABASE_URL: postgresql+asyncpg://memory:memory@localhost:5432/memory_game
      REDIS_URL: redis://localhost:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
